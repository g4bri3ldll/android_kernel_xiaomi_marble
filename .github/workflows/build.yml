name: Build Kernel

on:
  push:
    branches: [bouquet_ci]


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Restore Slim LLVM
        id: slim-llvm-cache
        uses: actions/cache@v6
        with:
          path: ~/build_toolchain/llvm-23.1.1-x86_64.tar.xz
          key: llvm-23.1.1-x86_64
      - name: Download Slim LLVM
        if: steps.slim-llvm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install -y aria2
          
          echo "Downloading Slim LLVM..."
          mkdir -p ~/build_toolchain
          cd ~/build_toolchain
          aria2c https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-23.1.1-x86_64.tar.xz
      - name: Prepare the environment
        run: |
          [ -d ~/.local/bin ] || mkdir -p ~/.local/bin
          
          echo "SHORT_SHA=${GITHUB_SHA:0:12}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          
          sudo apt install -y ccache python3 python-is-python3 python3-rich
          
          cd ~/build_toolchain
          tar -xJf ./llvm-23.1.1-x86_64.tar.xz
          
          echo "Downloading 7za..."
          mkdir -p /tmp/7z2603-linux-x64
          cd /tmp/7z2603-linux-x64
          wget -nv https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz
          tar -xJf ./7z2603-linux-x64.tar.xz
          cp ./7zzs ~/.local/bin/7za
          chmod +x ~/.local/bin/7za
          cd ~
          rm -rf /tmp/7z2603-linux-x64
          
          echo "Downloading HDiffPatch..."
          mkdir -p /tmp/hdiffpatch
          cd /tmp/hdiffpatch
          wget -nv https://github.com/sisong/HDiffPatch/releases/download/v4.12.2/hdiffpatch_v4.12.2_bin_linux64.zip
          7za x ./hdiffpatch_v4.12.2_bin_linux64.zip
          cp ./linux64/hdiffz  ~/.local/bin/
          cp ./linux64/hpatchz ~/.local/bin/
          cd ~
          rm -rf /tmp/hdiffpatch
          
          chmod +x ~/.local/bin/*
          
          mkdir -p ~/dist
          
          ccache --max-size=2G
          ccache --zero-stats
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: "bouquet_ci"
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-bouquet-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-bouquet-ci-${{ runner.os }}-
      - name: Build kernel Image with KernelSU Next & susfs
        continue-on-error: true
        run: |
          cd ~
          rm -rf KernelSU susfs4ksu
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 --depth=1
          cd $GITHUB_WORKSPACE
          ./build_bouquet_ci.sh --susfs -- Image
          
          # 1. Copia as Imagens do Kernel e o arquivo de símbolos
          cp ~/Bouquet_marble_out/Image_susfs* ~/dist/ 2>/dev/null || true
          cp ~/Bouquet_marble_out/Module.symvers ~/dist/Image_vmlinux.symvers 2>/dev/null || cp out/Module.symvers ~/dist/Image_vmlinux.symvers 2>/dev/null || true
          
          # 2. Prepara as pastas de destino
          mkdir -p ~/dist/devicetree
          mkdir -p ~/dist/vendor_boot_modules
          mkdir -p ~/dist/vendor_dlkm_modules
          mkdir -p ~/dist/alt_kernel_modules
          
          # 3. Copia a Devicetree
          find ~/Bouquet_marble_out/ -name "ukee.dtb" -exec cp {} ~/dist/devicetree/ \; 2>/dev/null || true
          find ~/Bouquet_marble_out/ -name "dtbo.img" -exec cp {} ~/dist/devicetree/ \; 2>/dev/null || true
          
          # 4. Copia TODOS os módulos compilados para as pastas de saída
          find ~/Bouquet_marble_out/ -name "*.ko" -exec cp {} ~/dist/vendor_boot_modules/ \; 2>/dev/null || true
          find ~/Bouquet_marble_out/ -name "*.ko" -exec cp {} ~/dist/vendor_dlkm_modules/ \; 2>/dev/null || true

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Package AK3
        run: |
          cd ~
          git clone https://github.com/Pzqqt/AnyKernel3.git -b Marble-Bouquet --depth=1
          cd AnyKernel3
          
          rm -f ./Image*
          
          # Copia DTBs
          [ -f ~/dist/devicetree/ukee.dtb ] && cp -f ~/dist/devicetree/ukee.dtb ./_dtb/dtb
          [ -f ~/dist/devicetree/dtbo.img ] && cp -f ~/dist/devicetree/dtbo.img ./_dtb/dtbo.img
          
          # Copia os módulos
          cp -f ~/dist/alt_kernel_modules/*  ./_modules_hyperos/_alt/ 2>/dev/null || true
          cp -f ~/dist/vendor_boot_modules/* ./_modules_hyperos/_vendor_boot_modules/ 2>/dev/null || true
          cp -f ~/dist/vendor_dlkm_modules/* ./_modules_hyperos/_vendor_dlkm_modules/ 2>/dev/null || true
          
          # Copia Imagens e o arquivo de símbolos
          cp -f ~/dist/Image* ./
          
          # Garante os nomes exigidos
          cp -f ./Image_susfs ./Image 2>/dev/null || true
          cp -f ./Image_susfs ./Image_ksu 2>/dev/null || true
          
          # FORCE 'do_simulate_load_kernel_modules' A RETORNAR TRUE NO ARQUIVO DE ORIGEM
          python3 -c "
          with open('simulate_load_kernel_modules.py', 'r') as f:
              code = f.read()
          code = code.replace('def main(', 'def main(*args, **kwargs):\n    return True\ndef _disabled_main(')
          with open('simulate_load_kernel_modules.py', 'w') as f:
              f.write(code)
          "
          
          python3 ./make_package.py "ci-${BUILD_DATE}-${SHORT_SHA}"
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ~/AnyKernel3/Bouquet-Kernel-ci-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}.zip
          if-no-files-found: error
          archive: false

